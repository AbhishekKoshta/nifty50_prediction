name: Update Nifty data

on:
  schedule:
    - cron: "40 3 * * 1-5"    # 09:10 IST, Mon-Fri — capture today's open
    - cron: "30 10 * * 1-5"   # 16:00 IST, Mon-Fri — append the completed bar
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy yfinance

      - name: Morning — capture today's open (09:10 IST)
        if: github.event.schedule == '40 3 * * 1-5'
        run: python mark_open.py

      - name: Afternoon / manual — append completed bar & clear stale open
        if: github.event.schedule != '40 3 * * 1-5'
        run: |
          python update_data.py
          rm -f today_open.json

      - name: Commit changes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Nifty50_till2025.csv Nifty_Features.csv
          git add today_open.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update: Nifty data / today's open ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin main   # integrate any commits pushed since checkout
            git push
          fi
